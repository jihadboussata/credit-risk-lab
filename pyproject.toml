[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-lab"
version = "1.0.0"
description = "A reproducible behavioral credit-risk study: SQL, classical ML, calibration and decision analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "scikit-learn==1.6.1", "xgboost==3.0.2", "matplotlib==3.10.3",
  "seaborn==0.13.2", "plotly==6.1.2", "dash==3.0.4",
  "xlrd==2.0.1", "joblib==1.5.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "nbformat==5.10.4", "nbconvert==7.16.6", "ipykernel==6.29.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
